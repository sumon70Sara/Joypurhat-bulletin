<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joypurhat Bulletin — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f3f5f9;color:#172033}
header{background:#0d172b;color:#fff;padding:22px 16px;text-align:center}header h1{margin:0 0 14px;font-size:28px}
.wrap{max-width:1000px;margin:22px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 22px #00000012}
h2{margin-top:0}label{display:block;font-size:18px;margin:14px 0 7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}
textarea{min-height:180px;resize:vertical}button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}
.primary{background:#1769e0;color:#fff}.danger{background:#df2631;color:#fff}.muted{background:#e9edf3}.row{display:flex;gap:10px;flex-wrap:wrap}
.hidden{display:none!important}.msg{padding:10px;border-radius:8px;margin:10px 0}.ok{background:#e7f7ed;color:#176b37}.err{background:#fdebec;color:#9d1c26}
.news{border:1px solid #e0e5ee;border-radius:12px;padding:14px;margin-top:12px}.news img{width:120px;height:80px;object-fit:cover;border-radius:8px;float:left;margin-right:12px}.news:after{content:"";display:block;clear:both}.small{font-size:14px;color:#657085}
#preview{max-width:220px;max-height:150px;border-radius:10px;margin-top:10px;display:none}
</style>
</head>
<body>
<header><h1>📰 Joypurhat Bulletin — News Admin</h1><button id="logout" class="danger hidden">Logout</button></header>
<div class="wrap">

<section id="loginCard" class="card">
<h2>🔐 Admin Login</h2>
<div id="loginMsg"></div>
<label>Email</label><input id="email" type="email" placeholder="admin email">
<label>Password</label><input id="password" type="password" placeholder="password">
<button id="loginBtn" class="primary">Login</button>
</section>

<section id="app" class="hidden">
<div class="card">
<h2 id="formTitle">📝 নতুন নিউজ যোগ করুন</h2>
<div id="msg"></div>
<input id="newsId" type="hidden">
<label>নিউজের শিরোনাম</label><input id="title" placeholder="নিউজের শিরোনাম লিখুন">
<label>ক্যাটাগরি</label>
<select id="category"><option>জয়পুরহাট</option><option>কালাই</option><option>ক্ষেতলাল</option><option>পাঁচবিবি</option><option>আক্কেলপুর</option><option>জাতীয়</option><option>রাজনীতি</option><option>খেলাধুলা</option><option>অন্যান্য</option></select>
<label>ছবি আপলোড করুন</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp">
<img id="preview" alt="preview">
<label>সংক্ষিপ্ত বিবরণ</label><textarea id="excerpt" style="min-height:100px" placeholder="সংক্ষেপে লিখুন"></textarea>
<label>নিউজের বিস্তারিত</label><textarea id="content" placeholder="সম্পূর্ণ সংবাদ লিখুন"></textarea>
<label><input id="published" type="checkbox" checked style="width:auto"> এখনই প্রকাশ করুন</label>
<div class="row"><button id="saveBtn" class="primary">💾 নিউজ প্রকাশ/সংরক্ষণ করুন</button><button id="cancelBtn" class="muted hidden">বাতিল</button></div>
</div>

<div class="card"><h2>📚 প্রকাশিত/সংরক্ষিত নিউজ</h2><div id="list">লোড হচ্ছে...</div></div>
</section>
</div>

<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
let currentUser = null;
let editing = null;

function showMsg(el, text, ok=false){ el.innerHTML = `<div class="msg ${ok?'ok':'err'}">${text}</div>`; }
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function start(){
 const {data:{session}} = await sb.auth.getSession();
 if(session){currentUser=session.user; showApp();} else showLogin();
}
function showLogin(){ $('loginCard').classList.remove('hidden'); $('app').classList.add('hidden'); $('logout').classList.add('hidden'); }
async function showApp(){ $('loginCard').classList.add('hidden'); $('app').classList.remove('hidden'); $('logout').classList.remove('hidden'); await loadNews(); }

$('loginBtn').onclick = async ()=>{
 const email=$('email').value.trim(), password=$('password').value;
 if(!email||!password) return showMsg($('loginMsg'),'ইমেইল ও পাসওয়ার্ড দিন');
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error) return showMsg($('loginMsg'),error.message);
 currentUser=data.user; showApp();
};
$('logout').onclick = async ()=>{await sb.auth.signOut(); showLogin();};

$('image').onchange = ()=>{
 const f=$('image').files[0]; if(!f)return;
 if(f.size>5*1024*1024){showMsg($('msg'),'ছবির আকার ৫ MB-এর মধ্যে রাখুন'); $('image').value=''; return;}
 $('preview').src=URL.createObjectURL(f); $('preview').style.display='block';
};

async function uploadImage(file){
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
 const path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;
 const {error}=await sb.storage.from('news-images').upload(path,file,{contentType:file.type,upsert:false});
 if(error) throw error;
 const {data}=sb.storage.from('news-images').getPublicUrl(path);
 return {url:data.publicUrl,path};
}
async function deleteImage(path){ if(path) await sb.storage.from('news-images').remove([path]); }

$('saveBtn').onclick = async ()=>{
 try{
  if(!currentUser) throw new Error('Admin login প্রয়োজন');
  const title=$('title').value.trim(), content=$('content').value.trim();
  if(!title||!content) throw new Error('শিরোনাম ও বিস্তারিত সংবাদ লিখুন');
  $('saveBtn').disabled=true; $('saveBtn').textContent='সংরক্ষণ হচ্ছে...';
  let imageUrl=editing?.image_url||null, imagePath=editing?.image_path||null;
  const file=$('image').files[0];
  if(file){
   const up=await uploadImage(file);
   if(imagePath) await deleteImage(imagePath);
   imageUrl=up.url; imagePath=up.path;
  }
  const payload={
   title, category:$('category').value, image_url:imageUrl, image_path:imagePath,
   excerpt:$('excerpt').value.trim(), content, published:$('published').checked,
   updated_at:new Date().toISOString()
  };
  let error;
  if(editing){
   ({error}=await sb.from('news').update(payload).eq('id',editing.id));
  }else{
   ({error}=await sb.from('news').insert(payload));
  }
  if(error) throw error;
  showMsg($('msg'),editing?'নিউজ আপডেট হয়েছে।':'নিউজ প্রকাশ হয়েছে।',true);
  resetForm(); await loadNews();
 }catch(e){showMsg($('msg'),e.message||'কাজটি করা যায়নি');}
 finally{$('saveBtn').disabled=false;$('saveBtn').textContent='💾 নিউজ প্রকাশ/সংরক্ষণ করুন';}
};

async function loadNews(){
 const {data,error}=await sb.from('news').select('*').order('created_at',{ascending:false});
 if(error){$('list').textContent=error.message;return;}
 if(!data?.length){$('list').textContent='এখনও কোনো নিউজ নেই।';return;}
 $('list').innerHTML=data.map(n=>`
 <div class="news">
 ${n.image_url?`<img src="${esc(n.image_url)}" alt="">`:''}
 <b>${esc(n.title)}</b><div class="small">${esc(n.category)} · ${n.published?'প্রকাশিত':'খসড়া'}</div>
 <p>${esc(n.excerpt||n.content.slice(0,160))}</p>
 <div class="row"><button class="muted" onclick='editNews(${JSON.stringify(n).replace(/'/g,"&#39;")})'>✏️ Edit</button>
 <button class="danger" onclick="removeNews(${n.id})">🗑️ Delete</button></div>
 </div>`).join('');
}
window.editNews = n=>{
 editing=n;$('newsId').value=n.id;$('formTitle').textContent='✏️ নিউজ সম্পাদনা';
 $('title').value=n.title;$('category').value=n.category;$('excerpt').value=n.excerpt||'';$('content').value=n.content;$('published').checked=n.published;
 if(n.image_url){$('preview').src=n.image_url;$('preview').style.display='block';}else $('preview').style.display='none';
 $('cancelBtn').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'});
};
window.removeNews = async id=>{
 if(!confirm('এই নিউজটি মুছে ফেলবেন?'))return;
 const {data}=await sb.from('news').select('image_path').eq('id',id).single();
 const {error}=await sb.from('news').delete().eq('id',id);
 if(error){showMsg($('msg'),error.message);return;}
 if(data?.image_path) await deleteImage(data.image_path);
 showMsg($('msg'),'নিউজ মুছে ফেলা হয়েছে।',true); await loadNews();
};
function resetForm(){editing=null;$('newsId').value='';$('title').value='';$('excerpt').value='';$('content').value='';$('published').checked=true;$('image').value='';$('preview').style.display='none';$('formTitle').textContent='📝 নতুন নিউজ যোগ করুন';$('cancelBtn').classList.add('hidden');}
$('cancelBtn').onclick=resetForm;
sb.auth.onAuthStateChange((_event,session)=>{if(session){currentUser=session.user;}else{currentUser=null;showLogin();}});
start();
</script>
</body>
</html>
