<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* LOGIN */
.login-box{
    max-width:400px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
}

input, textarea, select{
    width:100%;
    padding:12px;
    margin:7px 0 15px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    border:0;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.login-btn,
.save-btn{
    width:100%;
    background:#2563eb;
    color:white;
}

.login-btn:hover,
.save-btn:hover{
    background:#1d4ed8;
}

.error{
    color:#dc2626;
    text-align:center;
    margin-top:10px;
}

/* ADMIN */
header{
    background:#0f172a;
    color:white;
    padding:15px 20px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logout{
    background:#dc2626;
    color:white;
}

.dashboard{
    display:none;
}

.card{
    background:white;
    padding:20px;
    margin:20px 0;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
}

.news-item{
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    margin:15px 0;
}

.news-item h3{
    margin-top:0;
}

.news-date{
    color:#64748b;
    font-size:13px;
}

.actions{
    margin-top:12px;
}

.edit{
    background:#f59e0b;
    color:white;
    margin-right:5px;
}

.delete{
    background:#dc2626;
    color:white;
}

.cancel{
    background:#64748b;
    color:white;
    width:100%;
    margin-top:8px;
}

.preview-image{
    max-width:200px;
    margin-top:10px;
    border-radius:8px;
}

.empty{
    text-align:center;
    color:#64748b;
    padding:20px;
}

@media(max-width:600px){
    .header-inner{
        flex-direction:column;
        gap:10px;
    }

    .container{
        padding:12px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">

    <div class="login-box">

        <h2>🔐 Admin Login</h2>

        <label>Username</label>
        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button class="login-btn" onclick="login()">
            Login
        </button>

        <div id="loginError" class="error"></div>

    </div>

</div>


<!-- ADMIN DASHBOARD -->
<div id="dashboard" class="dashboard">

<header>

    <div class="header-inner">

        <h2>📰 News Admin Panel</h2>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="container">

    <!-- ADD / EDIT NEWS -->

    <div class="card">

        <h2 id="formTitle">📝 নতুন নিউজ যোগ করুন</h2>

        <input type="hidden" id="editId">

        <label>নিউজের শিরোনাম</label>

        <input
            type="text"
            id="newsTitle"
            placeholder="নিউজের শিরোনাম লিখুন"
        >


        <label>ক্যাটাগরি</label>

        <select id="newsCategory">

            <option value="জাতীয়">জাতীয়</option>
            <option value="রাজনীতি">রাজনীতি</option>
            <option value="স্থানীয়">স্থানীয়</option>
            <option value="শিক্ষা">শিক্ষা</option>
            <option value="স্বাস্থ্য">স্বাস্থ্য</option>
            <option value="খেলাধুলা">খেলাধুলা</option>
            <option value="আন্তর্জাতিক">আন্তর্জাতিক</option>
            <option value="অন্যান্য">অন্যান্য</option>

        </select>


        <label>ছবির URL</label>

        <input
            type="text"
            id="newsImage"
            placeholder="https://example.com/image.jpg"
        >


        <label>নিউজের বিস্তারিত</label>

        <textarea
            id="newsContent"
            placeholder="নিউজের বিস্তারিত লিখুন..."
        ></textarea>


        <button class="save-btn" onclick="saveNews()">
            💾 নিউজ সংরক্ষণ করুন
        </button>

        <button
            class="cancel"
            id="cancelBtn"
            onclick="cancelEdit()"
            style="display:none;"
        >
            বাতিল করুন
        </button>

    </div>


    <!-- NEWS LIST -->

    <div class="card">

        <h2>📰 প্রকাশিত নিউজ</h2>

        <div id="newsList"></div>

    </div>

</div>

</div>


<script>

/* =========================
   ADMIN LOGIN
========================= */

/*
   DEMO LOGIN

   Username: admin
   Password: 12345

   IMPORTANT:
   এটি নিরাপদ production login নয়।
*/

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "12345";


function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");


    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        sessionStorage.setItem("adminLoggedIn","true");

        showDashboard();

    }else{

        error.textContent =
            "Username অথবা Password ভুল!";

    }

}


/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard(){

    document.getElementById("loginPage").style.display =
        "none";

    document.getElementById("dashboard").style.display =
        "block";

    loadNews();

}


/* =========================
   LOGOUT
========================= */

function logout(){

    sessionStorage.removeItem("adminLoggedIn");

    location.reload();

}


/* =========================
   NEWS DATA
========================= */

function getNews(){

    return JSON.parse(
        localStorage.getItem("websiteNews") || "[]"
    );

}


/* =========================
   SAVE NEWS
========================= */

function saveNews(){

    const title =
        document.getElementById("newsTitle").value.trim();

    const category =
        document.getElementById("newsCategory").value;

    const image =
        document.getElementById("newsImage").value.trim();

    const content =
        document.getElementById("newsContent").value.trim();

    const editId =
        document.getElementById("editId").value;


    if(!title || !content){

        alert("শিরোনাম এবং নিউজের বিস্তারিত লিখুন।");

        return;

    }


    let news = getNews();


    if(editId){

        const index = news.findIndex(
            item => item.id == editId
        );


        if(index !== -1){

            news[index].title = title;
            news[index].category = category;
            news[index].image = image;
            news[index].content = content;

        }


        alert("নিউজ সফলভাবে আপডেট হয়েছে!");

    }else{

        const newNews = {

            id: Date.now(),

            title: title,

            category: category,

            image: image,

            content: content,

            date: new Date().toLocaleString("bn-BD")

        };


        news.unshift(newNews);


        alert("নিউজ সফলভাবে যোগ হয়েছে!");

    }


    localStorage.setItem(
        "websiteNews",
        JSON.stringify(news)
    );


    clearForm();

    loadNews();

}


/* =========================
   LOAD NEWS
========================= */

function loadNews(){

    const news = getNews();

    const list =
        document.getElementById("newsList");


    list.innerHTML = "";


    if(news.length === 0){

        list.innerHTML =
            '<div class="empty">এখনো কোনো নিউজ যোগ করা হয়নি।</div>';

        return;

    }


    news.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "news-item";


        div.innerHTML = `

            <h3>${escapeHTML(item.title)}</h3>

            <div class="news-date">
                ${escapeHTML(item.category)}
                | ${escapeHTML(item.date || "")}
            </div>

            ${
                item.image
                ?
                `<img
                    class="preview-image"
                    src="${escapeAttribute(item.image)}"
                    alt="News Image"
                >`
                :
                ""
            }

            <p>
                ${escapeHTML(item.content)}
            </p>

            <div class="actions">

                <button
                    class="edit"
                    onclick="editNews(${item.id})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteNews(${item.id})"
                >
                    🗑️ Delete
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* =========================
   EDIT NEWS
========================= */

function editNews(id){

    const news = getNews();

    const item = news.find(
        n => n.id == id
    );


    if(!item) return;


    document.getElementById("editId").value =
        item.id;

    document.getElementById("newsTitle").value =
        item.title;

    document.getElementById("newsCategory").value =
        item.category;

    document.getElementById("newsImage").value =
        item.image || "";

    document.getElementById("newsContent").value =
        item.content;


    document.getElementById("formTitle").textContent =
        "✏️ নিউজ Edit করুন";

    document.getElementById("cancelBtn").style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   DELETE NEWS
========================= */

function deleteNews(id){

    const confirmDelete =
        confirm("আপনি কি এই নিউজটি Delete করতে চান?");


    if(!confirmDelete) return;


    let news = getNews();


    news = news.filter(
        item => item.id != id
    );


    localStorage.setItem(
        "websiteNews",
        JSON.stringify(news)
    );


    loadNews();

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

    clearForm();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document.getElementById("editId").value = "";

    document.getElementById("newsTitle").value = "";

    document.getElementById("newsCategory").value =
        "জাতীয়";

    document.getElementById("newsImage").value = "";

    document.getElementById("newsContent").value = "";

    document.getElementById("formTitle").textContent =
        "📝 নতুন নিউজ যোগ করুন";

    document.getElementById("cancelBtn").style.display =
        "none";

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(text){

    return String(text)
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/* =========================
   AUTO LOGIN CHECK
========================= */

if(
    sessionStorage.getItem("adminLoggedIn") === "true"
){

    showDashboard();

}

</script>

</body>
</html>
